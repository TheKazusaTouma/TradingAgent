name: requirements-schema

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install 'PyYAML>=6' 'jsonschema>=4.18'
      - name: Validate schema and identifiers
        run: python scripts/check_requirements.py
