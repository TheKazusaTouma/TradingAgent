    status: approved

  - id: INV-9
    type: invariant
    title: "Failed audit retained"
    statement: >
      A failed run writes a failed-run audit entry that cannot be mistaken for a
      successful decision, and retains its checkpoint when checkpointing is enabled.
    priority: must
    fit_criterion: >
      Fits when a failed run leaves a distinct failed-run audit and retains its checkpoint.
      Does not fit if a failure is silent or overwrites a prior success.
    metric: "failed-run audit files written and checkpoint steps retained"
    threshold: ">= 1 audit carrying a failure status; checkpoint still readable"
    tradeoff: >
      Extra artifacts accumulate; they are never deleted by this increment.
    source: "ADR-001 section 2.8, section 5; test spec T-18, T-19, T-30"
    verified_by:
      - "tests/test_agent_contracts_integration.py::test_t18_failure_retains_checkpoint_and_writes_audit"
      - "tests/test_agent_contracts_integration.py::test_t19_failed_run_has_a_contract_block_and_no_fabricated_proposal"
      - "tests/test_agent_contracts_integration.py::test_g_two_consecutive_failures_keep_both_audits"

    verification: ["T-18", "T-19", "T-30"]
    status: approved

  - id: NFR-1
    type: non-functional
    title: "No wasted model spend on invalid input"
    statement: "100% of negative-input fixtures produce zero model invocations."
    priority: must
    fit_criterion: >
      Fits when every negative-input fixture costs no model spend. Does not fit if any such
      fixture invokes a model.
    metric: "share of negative-input fixtures that produce zero model invocations"
    threshold: "100%"
    tradeoff: >
      Validation logic must be complete before the first call.
    source: "ADR-001 section 5 (positive consequences); test spec T-3, T-4"
    verified_by:
      - "tests/test_agent_contracts.py::test_t3_invalid_input_costs_zero_calls"

    verification: ["T-3", "T-4"]
    status: approved

  - id: NFR-2
    type: non-functional
    title: "Bounded recovery"
    statement: "Recovery calls per agent per run <= 1."
    priority: must
    fit_criterion: >
      Fits when recovery is bounded to one call per agent per run. Does not fit if a retry
      loop is possible.
    metric: "recovery calls per agent per run"
    threshold: "<= 1"
    tradeoff: >
      A second repair is impossible even when it might succeed.
    source: "ADR-001 section 2.4; test spec T-10, T-11, T-27"
    verified_by:
      - "tests/test_agent_contracts.py::test_t11_two_failures_exhaust_the_budget"

    verification: ["T-10", "T-11", "T-27"]
    status: approved

  - id: NFR-3
    type: non-functional
    title: "Accounting completeness"
    statement: >
      The record contains structured, free_text_recovery, semantic_repair, logical_total,
      sdk_retry_budget and observed_http_attempts set to unknown.
    priority: should
    fit_criterion: >
      Fits when the record exposes exactly the documented accounting fields, with the retry
      budget from configuration and HTTP attempts marked unknown. Does not fit if a field is
      missing or a measured attempt count is invented.
    metric: "accounting keys present and the value of observed_http_attempts"
    threshold: "exactly six keys; observed_http_attempts == 'unknown'"
    tradeoff: >
      The record cannot report real HTTP cost; only logical calls are known.
    source: "ADR-001 section 2.12; test spec T-13, T-29"
    verified_by:
      - "tests/test_agent_contracts.py::test_t13_record_keys_and_retry_accounting"
      - "tests/test_agent_contracts.py::test_t13_configured_retry_budget_is_reported"

    verification: ["T-13", "T-29"]
    status: approved

  - id: NFR-4
    type: non-functional
    title: "Off-mode regression"
    statement: "The complete existing offline test suite passes unchanged in mode off."
    priority: must
    fit_criterion: >
      Fits when the complete existing offline suite passes with zero failures in off mode. Does
      not fit if any pre-existing test changes behaviour or fails.
    metric: "failures and errors in the offline suite"
    threshold: "0 failures, 0 errors"
    tradeoff: >
      Off mode is the default, so this regression guard must stay green for every change.
    source: "ADR-001 section 5; test spec T-1; AGENTS.md hard rule 4"
    verified_by:
      - "tests/test_agent_contracts_integration.py::test_t1_every_mode_reaches_the_same_decision"

    verification: ["T-1"]
    status: approved

  - id: NFR-5
    type: non-functional
    title: "Fail-closed exhaustion"
    statement: >
      100% of exhausted-validation fixtures end with no consumable decision and an
      audited failure state.
    priority: must
    fit_criterion: >
      Fits when every exhausted-validation fixture ends with no consumable decision and an
      audited failure. Does not fit if a failed run leaves a publishable state.
    metric: "exhausted fixtures producing a consumable decision or a silent failure"
    threshold: "0"
    tradeoff: >
